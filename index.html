<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>建筑环境模拟展示</title>
<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#0f172a;

        max-height:90%;
        border-radius:10px;
        box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    .label{
        font-size:14px;
        color:#9ca3af;
    }

    .value{
        font-size:18px;
        margin-top:5px;
    }
</style>
</head>

<div class="container">
